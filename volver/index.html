<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Listo · Stem</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0d; color: #ececec;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 420px; padding: 32px 24px; text-align: center; }
    .ok { width: 48px; height: 48px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255,122,26,.14); color: #ff7a1a; font-size: 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 22px; color: #8c8c8c; }
    a.btn { display: inline-block; padding: 9px 18px; border-radius: 8px; background: #ff7a1a; color: #0d0d0d;
      font-weight: 600; text-decoration: none; }
    small { display: block; margin-top: 18px; color: #6f6f6f; }
  </style>
</head>
<body>
  <main>
    <div class="ok" aria-hidden="true">✓</div>
    <h1>Listo, ya entraste a Stem</h1>
    <p>Volvé a Stem: tu cuenta ya está conectada. Podés cerrar esta pestaña.</p>
    <a class="btn" id="volver" href="stem://renderer/">Abrir Stem</a>
    <small>Si el navegador pregunta si querés abrir Stem, tocá «Abrir».</small>
  </main>
  <script>
    // Pasa a Stem los datos que dejó el login (solo a stem://renderer/, nunca a otro lado).
    var destino = 'stem://renderer/' + window.location.search + window.location.hash;
    document.getElementById('volver').setAttribute('href', destino);
    if (window.location.search) window.location.href = destino;
  </script>
</body>
</html>
